<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1">

                Imagem 3

                Imagem 4
            </div>
        </div>

                Imagem 4
            </div>
        </div>

            <div class="caption">
                Imagem 4
            </div>
        </div>
        <div class="card">
            <img src="img/revitalizacao de fachada.png" alt="Imagem 4" data-title="Imagem 4">
            <div class="caption">
                Imagem 4
            </div>
        </div>
        <div class="card">
            <img src="img/limpeza elevada.jpeg" alt="Imagem 4" data-title="Imagem 4">
            <div class="caption">
                Imagem 4
            </div>
        </div>
        <div class="card">
            <img src="img/limpeza elevada.jpeg" alt="Imagem 4" data-title="Imagem 4">
            <div class="caption">
                Imagem 4
            </div>
        </div>
        <div class="card">
            <img src="img/limpeza elevada.jpeg" alt="Imagem 4" data-title="Imagem 4">
            <div class="caption">
                Imagem 4
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="closeLightbox">
            &times;
        </button>
        <button class="lightbox-prev" id="prevImage">
            &#10094;
        </button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
        <button class="lightbox-next" id="nextImage">
            &#10095;
        </button>
        <div class="lightbox-counter" id="lightboxCounter">
            1 / 1
        </div>
    </div>
